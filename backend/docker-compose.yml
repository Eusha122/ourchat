name: ourchat-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourchat
      POSTGRES_PASSWORD: ourchat_dev_password
      POSTGRES_DB: ourchat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
